{% if page_obj %}<nav class="d-flex flex-wrap gap-3 justify-content-between align-items-center p-3" aria-label="Paginação">
<span class="small text-muted">{{ page_obj.paginator.count }} registros · página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
<div class="d-flex gap-2">{% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{{ pagination_query }}&amp;page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{{ pagination_query }}&amp;page={{ page_obj.next_page_number }}">Próxima</a>{% endif %}</div></nav>{% endif %}
