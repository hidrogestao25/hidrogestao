{% extends 'admin/delete_confirmation.html' %}
{% block content %}{{ block.super }}
<template id="nf-delete-reason"><p><label>Justificativa da exclusão/cancelamento (obrigatória para NF com histórico)<textarea name="justificativa_correcao" maxlength="4000" rows="3"></textarea></label></p></template>
<script>document.addEventListener('DOMContentLoaded',()=>{const f=document.querySelector('input[name="post"][value="yes"]')?.form;if(f)f.prepend(document.getElementById('nf-delete-reason').content.cloneNode(true));});</script>
{% endblock %}
