{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Renegociar Prazo do Contrato</h2>
    <p><strong>Solicitação:</strong> {{ solicitacao.contrato }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'detalhes_solicitacao' solicitacao.pk %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
